seed: 42
data:
  path: data/processed/interactions.csv
  tasks: [liked, strong_preference, repeat_interest, high_engagement]
split:
  train_users: 0.70
  val_users: 0.15
  test_users: 0.15
model:
  embedding_dim: 32
  hidden_dim: 64
  dropout: 0.10
  temperature: 0.20
  relationship_loss_weight: 0.25
  relationship_smoothing: 1.0
training:
  epochs: 12
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
