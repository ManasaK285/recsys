[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Industrial agentic engineering harness for autonomous software development"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "streamlit>=1.39",
  "requests>=2.32",
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "openai>=1.50",
]

[tool.setuptools.packages.find]
include = ["agents*", "harness*", "tools*", "verification*", "evaluation*", "tracing*", "api*", "ui*", "storage*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
