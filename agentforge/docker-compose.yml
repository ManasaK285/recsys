services:
  agentforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTFORGE_DB_PATH: /app/data/agentforge.db
      AGENTFORGE_WORKSPACE_ROOT: /app/artifacts/workspaces
    volumes:
      - agentforge-data:/app/data
      - agentforge-artifacts:/app/artifacts
volumes:
  agentforge-data:
  agentforge-artifacts:
