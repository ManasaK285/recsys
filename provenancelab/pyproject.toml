[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenancelab"
version = "0.1.0"
description = "End-to-end AI content provenance evaluation starter"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "streamlit>=1.38,<2.0", "pandas>=2.2,<3.0", "pydantic>=2.8,<3.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
