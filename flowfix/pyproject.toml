[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowfix"
version = "0.1.0"
description = "Low-latency, test-validated program repair demo"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.32", "requests>=2.31", "pytest>=8.0", "pandas>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
