[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "signalscope-ai"
version = "1.0.0"
description = "Evidence-grounded telemetry analytics platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "duckdb>=1.0", "pyarrow>=15.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "plotly>=5.20", "requests>=2.31"]
dev = ["pytest>=8.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
