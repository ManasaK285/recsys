[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-bargaining-lab"
version = "1.0.0"
description = "Research-inspired simulation of human-like, LLM-like, and Bayesian agents in multi-agent bargaining"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "streamlit>=1.32",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["bargaining_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
