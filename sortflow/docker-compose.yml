services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sortflow
      POSTGRES_USER: sortflow
      POSTGRES_PASSWORD: sortflow
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortflow -d sortflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://sortflow:sortflow@postgres:5432/sortflow
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO_DATA: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: rq worker sortflow --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://sortflow:sortflow@postgres:5432/sortflow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}

  dashboard:
    build: .
    command: streamlit run dashboard/Home.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  postgres_data:
